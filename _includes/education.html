{% assign education = site.data.data.education %}

{% if education %}

<div class="education-container container-block">

  <h2 class="container-block-title">
    {{ education.title }}
  </h2>

  {% for item in education.info %}

  <div class="item">

    <h3 class="degree">
      {{ item.degree }}
    </h3>

    <div class="education-university">
      {{ item.university }}
    </div>

    {% if item.field %}
    <div class="education-field">
      {{ item.field }}
    </div>
    {% endif %}

    {% if item.minor %}
    <div class="education-minor">
      {{ item.minor }}
    </div>
    {% endif %}

  </div>

  {% endfor %}

</div>

{% endif %}
