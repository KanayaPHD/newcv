{% assign education = site.data.data.education %}

{% if education %}

<div class="education-container container-block">

  <h2 class="container-block-title">
    {{ education.title }}
  </h2>

  {% for graduation in education.info %}

  <div class="item">

    <h4 class="degree">
      {{ graduation.degree }}
    </h4>

    {% if graduation.minor %}
    <div class="education-minor">
      {{ graduation.minor }}
    </div>
    {% endif %}

    <h5 class="meta">
      {{ graduation.university }}
    </h5>

  </div>

  {% endfor %}

</div>

{% endif %}
