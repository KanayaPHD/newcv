
{% assign media = site.data.data.media %}

{% if media %}
<section class="section publications-section">

  <h2 class="section-title">
    <span class="fa-stack fa-xs">
      <i class="fas fa-circle fa-stack-2x"></i>
      <i class="fas fa-tower-broadcast fa-stack-1x fa-inverse"></i>
    </span>
    {{ media.title }}
  </h2>

  {% if media.intro %}
  <div class="intro">
    {{ media.intro | markdownify }}
  </div>
  {% endif %}

  <ul class="media-list">
    {% for item in media.papers %}
    <li>
      {% if item.link %}
      <a href="{{ item.link }}"
         class="media-link"
         target="_blank"
         rel="noopener noreferrer">
        {{ item.title }}
        <i class="fas fa-external-link-alt"
           aria-hidden="true"></i>
      </a>
      {% else %}
        {{ item.title }}
      {% endif %}
    </li>
    {% endfor %}
  </ul>

</section>
{% endif %}
