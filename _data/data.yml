career-profile:
  title: Career Profile
  summary: |
    I'm an award-winning behavioral researcher and data scientist with over 25 years of experience 
    across academia, industry, and consulting. I examine behavior, cognitive processes, and motivation 
    across the lifespan, and my published research have focused on how these processes change over time 
    and vary across contexts. I've collaborated with engineers, designers, computer scientists, 
    and other stakeholders to inform software product development and evaluate policies. I also 
    help organizations develop data strategies that strengthen their analyses, decision-making, 
    and workflows.
    
    Rather than presenting a traditional CV, I've organized my work by research area and 
    analytical method to highlight the breadth of my experience.

