experiences:
  title: Research Applications
  info:
    - role: UX & Technology Adoption
      details: |
        Examine how program design and user experience influence
        technology adoption. Compare training formats to identify
        approaches associated with greater adoption, investigate
        barriers teachers face when using digital assessment tools,
        and develop evidence-based recommendations for improvement.
      papers:
        - citation: >-
            Kanaya, T., Light, D., & Culp, K. M. (2005).
            Factors influencing outcomes from a technology-focused
            professional development program.
            *Journal of Research on Technology in Education, 37*, 313–329.
        - citation: >-
            Martin, W., Heinze, C., Kanaya, T., Perez, H., & Hupert, N.
            (2005). Trends in use of handheld technology to support
            student reading assessment. Paper presented at the annual
            meeting of the Society for Informational Technology and
            Teacher Education, Phoenix, AZ.

    - role: Measurement & Assessment
      details: |
       Develop measures of cognitive processes and motivation, emphasizing validity, 
       reliability, and fairness. Identify scalable assessment practices that accurately 
       measure abilities, behaviors, and outcomes.
        
      papers:
        - citation: >-
            Scullin, M. H., Kanaya, T., & Ceci, S. J. (2002).
            Measurement of individual differences in children's
            suggestibility across situations.
            *Journal of Experimental Psychology: Applied, 8*, 233–246.
        - citation: >-
            Kanaya, T., & Ceci, S. J. (2007).
            Are all IQ scores created equal? The differential costs
            of IQ cut-off scores for at-risk children.
            *Child Development Perspectives, 1*, 52–56.

    - role: Program & Policy Evaluation
      details: |
        Evaluate the effectiveness and return on investment of
        programs, identifying opportunities for improvement.
        Analyze publicly available datasets to investigate
        policy-related questions, examine outcomes, and inform
        evidence-based recommendations.
      papers:
        - citation: >-
           Kanaya, T., Scullin, M.H. & Ceci, S.J. (2003). The Flynn effect and 
           U.S. policies: The impact of rising IQ scores on American society 
           via Mental Retardation diagnoses. *American Psychologist, 58,* 1-13
        - citation: >-
            Kanaya, T., & \*Osthoff-Magalhaes, I. (2013).
            *A two-level approach to determine Imagine LA's return
            on investment: Final Report.*
            Berger Institute for Work, Family and Children.

analytical_methods:
  title: Research Methods
  info:
    - role: AI, Machine Learning & NLP
      details: |
        Explore how computational methods can reveal patterns in
        language, cognition, and behavior. Apply natural language
        processing and machine learning to analyze complex data and
        investigate opportunities for AI-supported research and assessment.
      papers:
        - citation: >-
            Kanaya, T., & Kussmaul, C. (2025).
            Insights from natural language processing of short-response
            questions in a learning activity. Paper presented at the
            international meeting of Technology 4 Education, Chennai, India.
        - citation: >-
            Kanaya, T., & Magine, A. (2024).
            How can the current state of AI guide future conversations
            of general intelligence?
            *Journal of Intelligence, 12*(3), 36–44.
            DOI: https://doi.org/10.3390/jintelligence12030036

    - role: Statistical & Longitudinal Modeling
      details: |
        Use advanced statistical techniques to uncover relationships,
        examine change over time, and make sense of complex behavioral
        data. Expertise includes structural equation modeling, growth
        curve analysis, and propensity score methods.
      papers:
        - citation: >-
            Kanaya, T., Ceci, S. J., & Scullin, M. H. (2005).
            Age differences in secular IQ trends: An individual
            growth modeling approach.
            *Intelligence, 33*, 613–621.
        - citation: >-
            Kanaya, T., Wai, J., & Miranda, B. (2019).
            Exploring the links between receiving special education
            services and adulthood outcomes.
            *Frontiers in Education, 4*, 1–13.
            DOI: 10.3389/feduc.2019.00056

    - role: Experimentation & Research Design
      details: |
        Design rigorous studies that uncover how people think, learn,
        and make decisions. Combine experimental and survey methods
        to test hypotheses, identify meaningful patterns, and
        translate findings into evidence-based recommendations.
      papers:
        - citation: >-
            Principe, G. F., Kanaya, T., Ceci, S. J., &
            \*Singh, M. (2006). Believing is seeing: How rumors
            can engender false memories in preschoolers.
            *Psychological Science, 17*, 243–248.
        - citation: >-
            \*Deer, L. K., \*Gohn, K. M., & Kanaya, T. (2018).
            Anxiety and self-efficacy as sequential predictors of
            US college students' career preparation.
            *Education + Training, 60*, 185–197.
            DOI: 10.1108/ET-07-2017-0096


